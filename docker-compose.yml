services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gcp-iam-manager-backend:local
    env_file:
      - ./backend/.env
    environment:
      # Overrides the path from backend/.env to point at the read-only ADC
      # file mounted below — the container has no metadata server, so it
      # still needs an explicit credentials file: the host's ADC, generated
      # by `gcloud auth application-default login
      # --impersonate-service-account=...` (see README, seção Pré-requisitos).
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/adc.json
      # Overrides the Vite dev server URL from backend/.env — under Compose
      # the frontend is the nginx container on 8080, not localhost:5173.
      - FRONTEND_BASE_URL=http://localhost:8080
    volumes:
      # Monta o arquivo ADC do host — importante: o backend roda como non-root (UID 1001).
      # Se o arquivo tiver permissão 600 (padrão do `gcloud auth application-default login`),
      # o container não conseguirá ler e falhará com EACCES. Solução preferida:
      # `chgrp 1001 ~/.config/gcloud/application_default_credentials.json`
      # `chmod 640 ~/.config/gcloud/application_default_credentials.json`
      # Se chgrp falhar: use sudo, ou caia de volta pra `chmod 644 ...` (fallback).
      # Ver seção Troubleshooting do README para detalhes.
      - ${HOME}/.config/gcloud/application_default_credentials.json:/secrets/adc.json:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GCP_PROJECT_ID: ${VITE_GCP_PROJECT_ID:-}
    image: gcp-iam-manager-frontend:local
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:3001
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
