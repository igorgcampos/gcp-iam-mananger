services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: gcp-iam-manager-backend:local
    env_file:
      - ./backend/.env
    environment:
      # Overrides the path from backend/.env to point at the read-only
      # secret mounted below instead of baking the key into the image.
      - GOOGLE_APPLICATION_CREDENTIALS=/secrets/credentials.json
      # Overrides the Vite dev server URL from backend/.env — under Compose
      # the frontend is the nginx container on 8080, not localhost:5173.
      - FRONTEND_BASE_URL=http://localhost:8080
    volumes:
      - ./backend/credentials.json:/secrets/credentials.json:ro
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/api/health',(r)=>{process.exit(r.statusCode===200?0:1)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_GCP_PROJECT_ID: ${VITE_GCP_PROJECT_ID:-}
    image: gcp-iam-manager-frontend:local
    environment:
      - PORT=8080
      - BACKEND_URL=http://backend:3001
    ports:
      - "8080:8080"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
